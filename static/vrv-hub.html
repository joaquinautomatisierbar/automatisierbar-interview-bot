<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vRv Hub · automatisierbar</title>
<style>
:root{
  --bg:#0A0F0D; --surface-1:#111815; --surface-2:#18211D; --surface-3:#1F2A25;
  --text:#ECF3EF; --muted:#8A9892; --dim:#5A655F;
  --green:#15C97A; --green-dark:#0A8F54; --green-soft:#5EE0A6;
  --green-glow:rgba(21,201,122,.16); --border:rgba(255,255,255,.08);
  --amber:#E8B23D; --red:#E2604C; --radius:15px;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;min-height:100vh}
button{font-family:inherit}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 20px;background:linear-gradient(to bottom,var(--bg) 75%,rgba(10,15,13,0));backdrop-filter:blur(4px)}
.brand{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.brand b{color:var(--green)}
nav.tabs{display:flex;gap:4px;background:var(--surface-1);border:1px solid var(--border);border-radius:99px;padding:4px}
nav.tabs a{display:block;padding:7px 16px;border-radius:99px;font-size:13.5px;font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap}
nav.tabs a.on{background:var(--surface-3);color:var(--text)}
.spacer{flex:1}
.btn{display:inline-block;border:0;border-radius:11px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.btn-primary{background:var(--green);color:#06130C}
.btn-primary:hover{background:var(--green-soft)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text)}
.btn-small{padding:7px 13px;font-size:13px;border-radius:9px}

/* ---------- shell ---------- */
main{max-width:980px;margin:0 auto;padding:10px 20px 90px}
section.view{display:none}
section.view.on{display:block}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:10px}
h2.section-title{font-size:19px;margin:26px 0 12px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px}

/* ---------- login ---------- */
.login-wrap{max-width:420px;margin:12vh auto 0}
.login-wrap input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;
  padding:13px 15px;font-size:16px;color:var(--text);margin:14px 0 10px}
.login-wrap input:focus{outline:none;border-color:var(--green-dark)}
.err{color:var(--red);font-size:13.5px;min-height:20px;margin-bottom:8px}

/* ---------- dashboard ---------- */
.hero{display:flex;align-items:center;gap:26px;flex-wrap:wrap;background:linear-gradient(135deg,var(--surface-2),var(--surface-1));
  border:1px solid var(--border);border-radius:var(--radius);padding:26px 26px;margin-bottom:16px}
.hero .days{font-family:var(--mono);font-size:56px;font-weight:700;color:var(--green);line-height:1;white-space:nowrap}
.hero .days small{font-size:18px;color:var(--muted);font-weight:400}
.hero p{font-size:15px;color:var(--muted);max-width:52ch}
.hero p b{color:var(--text)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 4px}
.quick a{display:block;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:16px;
  text-decoration:none;color:var(--text)}
.quick a:hover{border-color:var(--green-dark)}
.quick .q-icon{font-size:22px;display:block;margin-bottom:8px}
.quick .q-title{font-weight:700;font-size:15px}
.quick .q-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
details.person{background:var(--surface-1);border:1px solid var(--border);border-radius:13px;margin-bottom:10px;overflow:hidden}
details.person summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 18px;font-weight:700;font-size:15px}
details.person summary::-webkit-details-marker{display:none}
details.person summary .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
details.person summary .chev{color:var(--dim);transition:transform .15s}
details.person[open] summary .chev{transform:rotate(90deg)}
details.person .body{padding:2px 18px 14px;border-top:1px solid var(--border)}
details.person .body.md{background:none;border:1px solid transparent;border-top:1px solid var(--border);border-radius:0;padding:2px 18px 14px}
.lane{background:var(--surface-1);border:1px solid var(--border);border-radius:13px;margin-bottom:10px;overflow:hidden}
.lane summary{list-style:none;cursor:pointer;padding:13px 18px}
.lane summary::-webkit-details-marker{display:none}
.lane .lane-head{display:flex;align-items:baseline;gap:10px}
.lane .lane-title{font-weight:700;font-size:14.5px}
.lane .lane-count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.bar{height:7px;border-radius:99px;background:var(--surface-3);margin-top:9px;overflow:hidden;display:flex}
.bar .fill{background:var(--green);height:100%}
.bar .part{background:var(--amber);height:100%;opacity:.75}
.lane .body{padding:4px 18px 13px;border-top:1px solid var(--border)}
.titem{display:flex;gap:9px;padding:5px 0;font-size:13.5px;color:var(--muted);align-items:baseline}
.titem .g{font-family:var(--mono);flex:none}
.titem.done .g{color:var(--green)} .titem.done{color:var(--dim)}
.titem.doing .g{color:var(--amber)} .titem.doing{color:var(--text)}
.titem.open .g{color:var(--dim)}
.ms{position:relative;padding-left:26px;margin-left:6px;border-left:2px solid var(--surface-3)}
.ms-row{position:relative;padding:7px 0 7px 4px;display:flex;gap:12px;align-items:baseline}
.ms-row::before{content:"";position:absolute;left:-31.5px;top:14px;width:9px;height:9px;border-radius:50%;
  background:var(--surface-3);border:2px solid var(--dim)}
.ms-row.past{opacity:.5}
.ms-row.past::before{background:var(--green);border-color:var(--green)}
.ms-row.emph .ms-label,.ms-row.emph .ms-date{color:var(--green);font-weight:700}
.ms-row.emph::before{background:var(--green);border-color:var(--green-soft);box-shadow:0 0 0 4px var(--green-glow)}
.ms-date{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap;min-width:74px}
.ms-label{font-size:14px}
.footnote{font-size:12.5px;color:var(--dim);margin-top:18px}
.footnote a{color:var(--muted)}

/* ---------- lernen + unterlagen ---------- */
.modgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mod{background:var(--surface-1);border:1px solid var(--border);border-radius:13px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.mod .mod-top{display:flex;gap:12px;align-items:baseline}
.mod .num{font-family:var(--mono);font-size:12px;color:var(--green);border:1px solid var(--green-dark);border-radius:99px;padding:2px 9px;white-space:nowrap}
.mod h3{font-size:15px}
.mod p{font-size:13px;color:var(--muted);flex:1}
.mod .row{display:flex;gap:8px}
.doc-row{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--surface-1);
  border:1px solid var(--border);border-radius:12px;margin-bottom:8px;text-decoration:none;color:var(--text)}
a.doc-row:hover{border-color:var(--green-dark)}
.doc-row.missing{opacity:.45}
.doc-row .t{font-weight:600;font-size:14.5px}
.doc-row .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.doc-row .grow{flex:1;min-width:0}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--muted);
  border:1px solid var(--border);border-radius:99px;padding:3px 9px;white-space:nowrap;flex:none}
.chip.grn{color:var(--green);border-color:var(--green-dark)}
.doc-actions{display:flex;gap:8px;flex:none}

/* ---------- doc reader ---------- */
.doc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.backlink{color:var(--muted);text-decoration:none;font-size:13.5px}
.backlink:hover{color:var(--text)}
.md{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:26px 28px;overflow-wrap:break-word}
.md h1{font-size:23px;margin:4px 0 14px;line-height:1.25}
.md h2{font-size:18px;margin:26px 0 10px;padding-top:14px;border-top:1px solid var(--border)}
.md h3{font-size:15.5px;margin:20px 0 8px}
.md h4{font-size:14px;margin:16px 0 6px;color:var(--green-soft)}
.md p{margin:9px 0;font-size:14.5px;color:#D5E0DA}
.md a{color:var(--green-soft)}
.md .deadlink{color:var(--muted);border-bottom:1px dotted var(--dim)}
.md ul,.md ol{margin:9px 0 9px 24px;font-size:14.5px;color:#D5E0DA}
.md li{margin:4px 0}
.md blockquote{border-left:3px solid var(--green-dark);background:var(--surface-2);border-radius:0 10px 10px 0;
  padding:10px 16px;margin:12px 0;color:var(--muted);font-size:13.5px}
.md blockquote p{color:var(--muted);font-size:13.5px}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--surface-3);border-radius:5px;padding:1.5px 6px;color:var(--green-soft)}
.md pre{background:#0D1411;border:1px solid var(--border);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:12px 0}
.md pre code{background:none;padding:0;color:#C9D6CF;font-size:12.5px;line-height:1.55}
.md hr{border:0;border-top:1px solid var(--border);margin:20px 0}
.md .tablewrap{overflow-x:auto;margin:12px 0;border:1px solid var(--border);border-radius:10px}
.md table{border-collapse:collapse;width:100%;font-size:13px}
.md th{font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);text-align:left}
.md th,.md td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top;min-width:90px}
.md tr:last-child td{border-bottom:0}
.md .task{display:flex;gap:9px;margin:4px 0;font-size:14px;color:#D5E0DA;align-items:baseline}
.md .task .g{font-family:var(--mono);flex:none}
.md .task.done .g{color:var(--green)} .md .task.done{color:var(--dim)}
.md .task.doing .g{color:var(--amber)}
.md .task.open .g{color:var(--dim)}
.notice{background:var(--surface-2);border:1px dashed var(--border);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--muted)}

/* ---------- responsive ---------- */
@media (max-width:720px){
  header.top{padding:10px 14px;gap:8px}
  .brand .brand-sub{display:none}
  nav.tabs{order:3;width:100%;justify-content:stretch}
  nav.tabs a{flex:1;text-align:center;padding:8px 6px}
  main{padding:6px 14px 70px}
  .hero{padding:20px;gap:14px}
  .hero .days{font-size:42px}
  .quick{grid-template-columns:1fr}
  .modgrid{grid-template-columns:1fr}
  .md{padding:18px 16px}
  .doc-row{flex-wrap:wrap}
  .doc-actions{width:100%}
  .doc-actions .btn{flex:1}
}

/* ---------- print ---------- */
@media print{
  body{background:#fff;color:#111}
  header.top,.doc-head .btn,.backlink{display:none!important}
  main{max-width:none;padding:0}
  .md{border:0;background:#fff;padding:0}
  .md p,.md ul,.md ol,.md li,.md .task,.md pre code{color:#111}
  .md h1,.md h2,.md h3,.md h4{color:#000}
  .md blockquote,.md blockquote p{background:#f4f4f4;color:#333}
  .md code{background:#eee;color:#0A5C38}
  .md a{color:#000}
  .md th,.md td{border-color:#ccc}
}
</style>
</head>
<body data-page="vrv-hub">

<header class="top" id="appHeader" style="display:none">
  <span class="brand"><b>▮</b> automatisierbar <span class="brand-sub">· <span style="color:var(--text)">vRv Hub</span></span></span>
  <nav class="tabs" id="tabs">
    <a href="#/" data-tab="start">Start</a>
    <a href="#/lernen" data-tab="lernen">Lernen</a>
    <a href="#/unterlagen" data-tab="unterlagen">Unterlagen</a>
  </nav>
  <span class="spacer"></span>
  <a class="btn btn-primary btn-small" href="/vrv/fragebogen">Fragebogen</a>
  <button class="btn btn-ghost btn-small" id="logoutBtn">Abmelden</button>
</header>

<main>
  <section class="view" id="view-login">
    <div class="login-wrap card">
      <div class="kicker">// vRv Hub</div>
      <h1 style="font-size:22px">Team-Anmeldung</h1>
      <p class="muted small" style="margin-top:6px">Alles zur vRv-Ausschreibung an einem Ort: Dashboard, Lernmodule, Unterlagen und der Fragebogen.</p>
      <input type="password" id="pw" placeholder="Team-Passwort" autocomplete="current-password">
      <div class="err" id="loginErr"></div>
      <button class="btn btn-primary" id="loginBtn" style="width:100%">Anmelden</button>
    </div>
  </section>
  <section class="view" id="view-app"><div id="content"></div></section>
</main>

<script>
"use strict";
/* vRv Hub SPA. Self-contained, no external resources. The markdown renderer
   below is CORPUS-FITTED to the ~37 files in tender-vrv/ — deliberate
   deviations from CommonMark (documented inline): no _underscore_ emphasis
   (filenames like tender_vrv_discovery would break), single newlines become
   <br> (mail templates and address blocks rely on it), naive table-cell
   split on | (corpus has no escaped/backticked pipes). Do not reuse as a
   general markdown engine. */

var MANIFEST = null;   // sections array from /api/vrv/docs
var DASH = null;       // payload from /api/vrv/dashboard
var BY_PATH = {};      // path -> {item, section}
var TARGET = new Date(2026, 7, 5); // 5. August 2026 (Monat 0-basiert)

/* ---------- tiny helpers ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function $(id){return document.getElementById(id)}
function show(view){
  document.querySelectorAll("section.view").forEach(function(s){s.classList.remove("on")});
  $(view).classList.add("on");
  $("appHeader").style.display = view==="view-app" ? "flex" : "none";
}
function api(path, opts){
  return fetch(path, opts).then(function(r){
    if(r.status===401){showLogin();throw new Error("401")}
    return r;
  });
}
function docUrl(p){return "/api/vrv/docs/"+p}

/* ---------- auth ---------- */
function showLogin(){show("view-login")}
function boot(){
  fetch("/api/vrv/whoami").then(function(r){return r.json()}).catch(function(){return {authed:false}})
    .then(function(w){ if(w.authed){enter()} else {showLogin()} });
}
$("loginBtn").onclick = function(){
  fetch("/api/vrv/login",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({password:$("pw").value})})
    .then(function(r){ if(r.ok){$("loginErr").textContent="";enter()}
      else{r.json().then(function(b){$("loginErr").textContent=(b&&b.error)||"Anmeldung fehlgeschlagen"}).catch(function(){$("loginErr").textContent="Anmeldung fehlgeschlagen"})} });
};
$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")$("loginBtn").click()});
$("logoutBtn").onclick = function(){
  fetch("/api/vrv/logout",{method:"POST"}).then(function(){showLogin()});
};

function enter(){
  Promise.all([
    api("/api/vrv/docs").then(function(r){return r.json()}),
    api("/api/vrv/dashboard").then(function(r){return r.json()})
  ]).then(function(res){
    MANIFEST = res[0].sections; DASH = res[1];
    BY_PATH = {};
    MANIFEST.forEach(function(sec){ sec.items.forEach(function(it){ BY_PATH[it.path]={item:it,section:sec} }) });
    show("view-app");
    route();
  }).catch(function(e){ if(String(e.message)!=="401") console.error(e) });
}

/* ---------- markdown renderer (corpus-fitted, see header comment) ---------- */
function normalizePath(baseDir, rel){
  var parts = baseDir ? baseDir.split("/") : [];
  var segs = rel.split("/");
  for(var i=0;i<segs.length;i++){
    var s = segs[i];
    if(s==="."||s==="") continue;
    if(s===".."){ if(!parts.length) return null; parts.pop(); continue }
    parts.push(s);
  }
  return parts.join("/");
}
function resolveDocLink(href, baseDir){
  if(/^https?:\/\//i.test(href)) return {href:href, ext:true};
  if(href.charAt(0)==="#"||href.charAt(0)==="/") return null;
  var norm = normalizePath(baseDir, href);
  if(norm===null||!BY_PATH[norm]) return null;   // out-of-tree / directory links stay plain text
  if(BY_PATH[norm].item.kind==="md") return {href:"#/doc/"+norm, ext:false};
  return {href:docUrl(norm), ext:true};
}
function inlineMd(escaped, baseDir){
  var codes=[];
  var s = escaped.replace(/`([^`]+)`/g,function(_,c){codes.push("<code>"+c+"</code>");return "\u0000"+(codes.length-1)+"\u0000"});
  s = s.replace(/\[([^\]]+)\]\(([^()\s]+)\)/g,function(_,txt,href){
    var l = resolveDocLink(href, baseDir);
    if(!l) return '<span class="deadlink" title="'+esc(href)+'">'+txt+"</span>";
    return '<a href="'+l.href+'"'+(l.ext?' target="_blank" rel="noopener"':"")+">"+txt+"</a>";
  });
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/(^|[\s(>·])\*([^*\s][^*]*?)\*(?=[\s.,:;!?)]|$)/g,'$1<em>$2</em>');
  s = s.replace(/\u0000(\d+)\u0000/g,function(_,n){return codes[Number(n)]});
  return s;
}
var TASK_GLYPH = {done:"✓", doing:"◐", open:"○"};
var TASK_STATE = {"x":"done","~":"doing"," ":"open"};
function mdToHtml(text, baseDir){
  var lines = text.split("\n");
  var out = [];
  var i = 0;
  function isSep(l){return /^\s*\|[\s:|-]+\|?\s*$/.test(l)}
  while(i<lines.length){
    var line = lines[i];
    if(/^\s*```/.test(line)){                                   // fences FIRST
      var buf=[]; i++;
      while(i<lines.length && !/^\s*```/.test(lines[i])){buf.push(lines[i]);i++}
      i++;
      out.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>");
      continue;
    }
    if(/^\s*$/.test(line)){i++;continue}
    var h = line.match(/^(#{1,4})\s+(.*)$/);
    if(h){var lv=h[1].length;out.push("<h"+lv+">"+inlineMd(esc(h[2]),baseDir)+"</h"+lv+">");i++;continue}
    if(/^\s*-{3,}\s*$/.test(line)){out.push("<hr>");i++;continue}
    if(/^>/.test(line)){
      var q=[];
      while(i<lines.length && /^>/.test(lines[i])){q.push(lines[i].replace(/^>\s?/,""));i++}
      out.push("<blockquote>"+mdToHtml(q.join("\n"),baseDir)+"</blockquote>");
      continue;
    }
    if(/^\s*\|/.test(line) && i+1<lines.length && isSep(lines[i+1])){
      var rows=[];
      while(i<lines.length && /^\s*\|/.test(lines[i])){rows.push(lines[i]);i++}
      out.push(renderTable(rows,baseDir));
      continue;
    }
    var task = line.match(/^\s*- \[([ x~])\]\s?(.*)$/);
    if(task){
      var t=[];
      while(i<lines.length && (task=lines[i].match(/^\s*- \[([ x~])\]\s?(.*)$/))){
        var st=TASK_STATE[task[1]];
        t.push('<div class="task '+st+'"><span class="g">'+TASK_GLYPH[st]+"</span><span>"+inlineMd(esc(task[2]),baseDir)+"</span></div>");
        i++;
      }
      out.push(t.join(""));
      continue;
    }
    if(/^\s*([-*]|\d+\.)\s+/.test(line)){
      var lst = renderList(lines, i, baseDir);
      out.push(lst.html);
      i = lst.next;
      continue;
    }
    var p=[];
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4})\s/.test(lines[i]) && !/^>/.test(lines[i]) &&
          !/^\s*```/.test(lines[i]) && !/^\s*\|/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i]) &&
          !/^\s*-{3,}\s*$/.test(lines[i])){
      p.push(inlineMd(esc(lines[i]),baseDir)); i++;
    }
    if(p.length) out.push("<p>"+p.join("<br>")+"</p>");
  }
  return out.join("\n");
}
function renderTable(rows, baseDir){
  var parsed = rows.map(function(r){
    return r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(function(c){return c.trim()});
  });
  var head = parsed[0];
  var body = parsed.slice(2);
  var html = ['<div class="tablewrap"><table>'];
  if(head.some(function(c){return c!==""})){
    html.push("<thead><tr>"+head.map(function(c){return "<th>"+inlineMd(esc(c),baseDir)+"</th>"}).join("")+"</tr></thead>");
  }
  html.push("<tbody>");
  body.forEach(function(cells){
    html.push("<tr>"+cells.map(function(c){return "<td>"+inlineMd(esc(c),baseDir)+"</td>"}).join("")+"</tr>");
  });
  html.push("</tbody></table></div>");
  return html.join("");
}
function renderList(lines, start, baseDir){
  var items=[]; var i=start;
  var ordered = /^\s*\d+\.\s+/.test(lines[start]);
  while(i<lines.length){
    if(/^\s*- \[[ x~]\]/.test(lines[i])) break;   // task list is its own block
    var m = lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if(!m){
      if(/^\s{2,}\S/.test(lines[i]) && items.length){items[items.length-1].text+="<br>"+inlineMd(esc(lines[i].trim()),baseDir);i++;continue}
      break;
    }
    var indent=m[1].length;
    if(indent>=2 && items.length){
      (items[items.length-1].sub=items[items.length-1].sub||[]).push(inlineMd(esc(m[3]),baseDir));
    } else {
      items.push({text:inlineMd(esc(m[3]),baseDir)});
    }
    i++;
  }
  var tag = ordered?"ol":"ul";
  var html = "<"+tag+">"+items.map(function(it){
    var sub = it.sub ? "<ul>"+it.sub.map(function(s){return "<li>"+s+"</li>"}).join("")+"</ul>" : "";
    return "<li>"+it.text+sub+"</li>";
  }).join("")+"</"+tag+">";
  return {html:html, next:i};
}

/* ---------- routing ---------- */
function route(){
  var hash = location.hash || "#/";
  var tab = "start";
  if(hash==="#/"||hash==="#"){renderStart()}
  else if(hash==="#/lernen"){tab="lernen";renderLernen()}
  else if(hash==="#/unterlagen"){tab="unterlagen";renderUnterlagen()}
  else if(hash.indexOf("#/doc/")===0){tab="";openDoc(hash.slice(6))}
  else {renderStart()}
  document.querySelectorAll("#tabs a").forEach(function(a){
    a.classList.toggle("on", a.getAttribute("data-tab")===tab);
  });
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* ---------- views ---------- */
function renderStart(){
  var el = $("content");
  var html = [];

  var today = new Date(); today.setHours(0,0,0,0);
  var days = Math.round((TARGET - today)/86400000);
  var daysTxt = days>1 ? "Noch "+days+" <small>Tage</small>" : days===1 ? "Noch 1 <small>Tag</small>" : days===0 ? "HEUTE" : "vorbei";
  html.push('<div class="hero"><div class="days" id="days">'+daysTxt+'</div>'+
    '<p><b>Mittwoch, 5. August 2026:</b> Termin bei der vR verwaltungen ag in Solothurn. '+
    'Wir zeigen kurz, wer wir sind, und stellen dann die richtigen Fragen. Aus den Antworten entsteht die Offerte.</p></div>');

  html.push('<div class="card"><div class="kicker">// Worum geht es?</div>'+
    '<p style="font-size:14.5px;color:#D5E0DA">Eine Immobilien-Firma aus Solothurn (28 Leute) will drei Dinge von uns: '+
    '<b>Schluss mit Zettelwirtschaft</b> bei Aufträgen, ihre Buchhaltung <b>pebe mit der Microsoft-Welt verbinden</b>, '+
    'und eine <b>Handy-App für die Hauswarte</b>. Es ist der erste Kunde, der von selbst zu uns kam. '+
    'Diese Seite ist unser gemeinsamer Ort dafür: lernen, nachlesen, erfassen.</p>'+
    '<div class="quick">'+
    '<a href="/vrv/fragebogen"><span class="q-icon">📝</span><span class="q-title">Fragebogen</span><div class="q-sub">61 Fragen für den Termin, mit Fortschritt</div></a>'+
    '<a href="#/lernen"><span class="q-icon">🎓</span><span class="q-title">Lernen</span><div class="q-sub">6 Module + die 50 Schmid-Fragen</div></a>'+
    '<a href="#/unterlagen"><span class="q-icon">📄</span><span class="q-title">Unterlagen</span><div class="q-sub">Alle Dokumente, lesbar im Browser</div></a>'+
    '</div></div>');

  html.push('<h2 class="section-title">Nächste Schritte pro Person</h2>');
  if(DASH.naechste_schritte_md){
    html.push(renderNextSteps(DASH.naechste_schritte_md));
  } else {
    html.push('<div class="notice">naechste-schritte.md fehlt auf dem Server.</div>');
  }

  html.push('<h2 class="section-title">Wo stehen wir?</h2>');
  if(DASH.tasks){
    DASH.tasks.lanes.forEach(function(lane){
      var pctDone = lane.total ? (lane.done/lane.total*100) : 0;
      var pctDoing = lane.total ? (lane.doing/lane.total*100) : 0;
      html.push('<details class="lane"><summary><div class="lane-head">'+
        '<span class="lane-title">'+esc(lane.title)+'</span>'+
        '<span class="lane-count">'+lane.done+' / '+lane.total+' erledigt'+(lane.doing?' · '+lane.doing+' läuft':'')+'</span></div>'+
        '<div class="bar"><div class="fill" style="width:'+pctDone+'%"></div><div class="part" style="width:'+pctDoing+'%"></div></div>'+
        '</summary><div class="body">'+
        lane.items.map(function(it){
          return '<div class="titem '+it.state+'"><span class="g">'+TASK_GLYPH[it.state]+'</span><span>'+inlineMd(esc(it.text),"")+'</span></div>';
        }).join("")+'</div></details>');
    });
  } else {
    html.push('<div class="notice">Aufgaben-Board konnte nicht gelesen werden'+(DASH.tasks_error?': '+esc(DASH.tasks_error):'')+'.</div>');
  }

  if(DASH.tasks && DASH.tasks.milestones.length){
    html.push('<h2 class="section-title">Meilensteine</h2><div class="card"><div class="ms">');
    var now = new Date(); now.setHours(0,0,0,0);
    DASH.tasks.milestones.forEach(function(m){
      var cls = m.emph ? " emph" : "";
      var dm = m.date.match(/^(\d{1,2})\.(\d{1,2})\.$/);
      if(dm && !m.emph){
        var d = new Date(2026, Number(dm[2])-1, Number(dm[1]));
        if(d<now) cls += " past";
      }
      html.push('<div class="ms-row'+cls+'"><span class="ms-date">'+esc(m.date)+'</span><span class="ms-label">'+esc(m.label)+'</span></div>');
    });
    html.push('</div></div>');
  }

  var stand = DASH.tasks && DASH.tasks.stand ? DASH.tasks.stand : "";
  html.push('<p class="footnote">'+(stand?('Stand Aufgaben-Board: '+esc(stand)+' · '):'')+
    'Details: <a href="#/doc/TASKS.md">Aufgaben-Board öffnen</a> · Diese Seite wird aus dem Board generiert.</p>');

  el.innerHTML = html.join("");
}
function renderNextSteps(md){
  var parts = md.split(/\n(?=## )/);
  var html = [];
  var first = true;
  parts.forEach(function(part){
    if(part.indexOf("## ")!==0) return;   // intro before the first person is skipped
    var nl = part.indexOf("\n");
    var name = part.slice(3, nl<0?part.length:nl).trim();
    var body = nl<0 ? "" : part.slice(nl+1);
    var openCount = (body.match(/^\s*- \[ \]/gm)||[]).length;
    html.push('<details class="person"'+(first?' open':'')+'><summary><span class="chev">▸</span>'+esc(name)+
      '<span class="count">'+(openCount?openCount+" offen":"")+'</span></summary>'+
      '<div class="body md">'+mdToHtml(body,"")+'</div></details>');
    first = false;
  });
  return html.join("");
}
function renderLernen(){
  var sec = MANIFEST.filter(function(s){return s.id==="lernen"})[0];
  var items = sec.items;
  var html = ['<h2 class="section-title" style="margin-top:14px">Lernen</h2>',
    '<p class="muted small" style="margin-bottom:14px">Sechs Module in Session-Reihenfolge. Erst den Primer lesen, dann das Quiz. Besprochen wird alles in den Team-Sessions.</p>',
    '<div class="modgrid">'];
  for(var i=0;i+1<items.length;i+=2){
    if(items[i].path.indexOf("fragen-bank")>=0) break;
    var primer = items[i], quiz = items[i+1];
    html.push('<div class="mod"><div class="mod-top"><span class="num">Session '+(i/2+1)+'</span><h3>'+esc(primer.title)+'</h3></div>'+
      '<p>'+esc(primer.desc)+'</p><div class="row">'+
      '<a class="btn btn-primary btn-small" href="#/doc/'+primer.path+'">Primer lesen</a>'+
      '<a class="btn btn-ghost btn-small" href="#/doc/'+quiz.path+'">Quiz</a></div></div>');
  }
  html.push('</div>');
  var fb = items[items.length-1];
  html.push('<div class="mod" style="margin-top:12px"><div class="mod-top"><span class="num">Drill</span><h3>'+esc(fb.title)+'</h3></div>'+
    '<p>'+esc(fb.desc)+'</p><div class="row"><a class="btn btn-primary btn-small" href="#/doc/'+fb.path+'">Öffnen</a></div></div>');
  $("content").innerHTML = html.join("");
}
function renderUnterlagen(){
  var html = ['<h2 class="section-title" style="margin-top:14px">Unterlagen</h2>',
    '<p class="muted small" style="margin-bottom:14px">Alle Dokumente des Projekts, direkt im Browser lesbar. Was fehlt, ist ausgegraut.</p>'];
  MANIFEST.forEach(function(sec){
    if(sec.id==="lernen") return;
    html.push('<h2 class="section-title">'+esc(sec.title)+'</h2>');
    sec.items.forEach(function(it){
      var missing = !it.exists;
      var inner = '<div class="grow"><div class="t">'+esc(it.title)+'</div><div class="d">'+esc(it.desc)+'</div></div>';
      if(missing){
        html.push('<div class="doc-row missing">'+inner+'<span class="chip">fehlt auf dem Server</span></div>');
      } else if(it.kind==="md"){
        html.push('<a class="doc-row" href="#/doc/'+it.path+'">'+inner+'<span class="chip grn">Lesen</span></a>');
      } else if(it.kind==="html"){
        html.push('<div class="doc-row">'+inner+'<div class="doc-actions">'+
          '<a class="btn btn-primary btn-small" href="'+docUrl(it.path)+'" target="_blank" rel="noopener">Deck öffnen</a></div></div>');
      } else if(it.kind==="pdf"){
        html.push('<div class="doc-row">'+inner+'<div class="doc-actions">'+
          '<a class="btn btn-ghost btn-small" href="'+docUrl(it.path)+'" target="_blank" rel="noopener">Öffnen</a>'+
          '<a class="btn btn-ghost btn-small" href="'+docUrl(it.path)+'" download>Download</a></div></div>');
      } else {
        html.push('<div class="doc-row">'+inner+'<div class="doc-actions">'+
          '<a class="btn btn-ghost btn-small" href="'+docUrl(it.path)+'">Download</a></div></div>');
      }
    });
  });
  $("content").innerHTML = html.join("");
}
function openDoc(path){
  var hit = BY_PATH[path];
  var el = $("content");
  if(!hit || hit.item.kind!=="md"){
    el.innerHTML = '<div class="doc-head"><a class="backlink" href="#/unterlagen">← Zurück</a></div>'+
      '<div class="notice">Dokument nicht gefunden.</div>';
    return;
  }
  el.innerHTML = '<div class="doc-head"><a class="backlink" href="#/unterlagen">← Zurück</a></div><div class="notice">Lade…</div>';
  api(docUrl(path)).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.text();
  }).then(function(text){
    var baseDir = path.indexOf("/")>=0 ? path.slice(0, path.lastIndexOf("/")) : "";
    el.innerHTML = '<div class="doc-head">'+
      '<a class="backlink" href="javascript:history.back()">← Zurück</a>'+
      '<span class="chip">'+esc(hit.section.title)+'</span>'+
      '<span class="spacer"></span>'+
      '<button class="btn btn-ghost btn-small" onclick="window.print()">Drucken</button></div>'+
      '<div class="md">'+mdToHtml(text, baseDir)+'</div>';
  }).catch(function(e){
    if(String(e.message)==="401") return;
    el.innerHTML = '<div class="doc-head"><a class="backlink" href="#/unterlagen">← Zurück</a></div>'+
      '<div class="notice">Konnte das Dokument nicht laden ('+esc(e.message)+').</div>';
  });
}

setInterval(function(){ if(location.hash===""||location.hash==="#/"){ /* countdown refresh */
  var d=$("days"); if(!d) return;
  var today=new Date(); today.setHours(0,0,0,0);
  var days=Math.round((TARGET-today)/86400000);
  d.innerHTML = days>1?"Noch "+days+" <small>Tage</small>":days===1?"Noch 1 <small>Tag</small>":days===0?"HEUTE":"vorbei";
}},60000);

boot();
